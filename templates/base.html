<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="theme-color" content="#131a20">
    <title>{% block title %}AI Career Copilot{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="{{ url_for('home') }}" aria-label="AI Career Copilot home">
                <span class="brand-mark" aria-hidden="true">C</span>
                <span class="brand-name">Career <strong>Copilot</strong></span>
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                {% if session.user %}
                <a class="{% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Workspace</a>
                <a class="{% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">History</a>
                <a class="nav-logout" href="{{ url_for('logout') }}">Sign out</a>
                {% else %}
                <a class="{% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('login') }}">Log in</a>
                <a class="nav-cta" href="{{ url_for('signup') }}">Create account <span aria-hidden="true">↗</span></a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p><span class="footer-mark">C</span> Career Copilot <span>·</span> Built for your next move</p>
    </footer>
    <script src="{{ url_for('static', filename='password-toggle.js') }}" defer></script>
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</body>
</html>
